<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube Maps</title>
<style>
  :root { --fg:#1a1a1a; --muted:#666; --card:#fff; --bg:#f4f5f7; --accent:#ff0000; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--fg); min-height: 100vh;
  }
  header { padding: 48px 24px 24px; text-align: center; }
  header h1 { margin: 0 0 6px; font-size: 30px; }
  header p { margin: 0; color: var(--muted); }
  main {
    max-width: 900px; margin: 0 auto; padding: 16px 24px 60px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px;
  }
  a.card {
    display: block; background: var(--card); border-radius: 12px; padding: 20px;
    text-decoration: none; color: inherit; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    transition: transform .12s ease, box-shadow .12s ease; border-top: 4px solid var(--accent);
  }
  a.card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.14); }
  a.card h2 { margin: 0 0 6px; font-size: 18px; }
  a.card p { margin: 0; color: var(--muted); font-size: 14px; }
  .empty { grid-column: 1/-1; color: var(--muted); text-align: center; padding: 40px; }
  footer { text-align:center; color: var(--muted); font-size: 12px; padding-bottom: 30px; }
</style>
</head>
<body>
  <header>
    <h1>YouTube Maps</h1>
    <p>Maps built from YouTube videos — click a thumbnail to watch the video.</p>
  </header>
  <main id="grid"></main>

<script>
/* =========================================================================
   ADD A CHANNEL HERE
   Each entry: { file, name, note }
     file : the channel's .html file in this folder
     name : title shown on the card
     note : short description under the title
   ========================================================================= */
const CHANNELS = [
  {
    file: "japanese-food-noodles.html",
    name: "Japanese Food Noodles",
    note: "Ramen & noodle shops across Japan",
  },
];
/* ===================== end of editable section ===================== */

const grid = document.getElementById("grid");
if (!CHANNELS.length) {
  grid.innerHTML = '<div class="empty">No channels yet. Add one to the CHANNELS list.</div>';
} else {
  grid.innerHTML = CHANNELS.map(c => `
    <a class="card" href="${c.file}">
      <h2>${c.name}</h2>
      <p>${c.note || ""}</p>
    </a>`).join("");
}
</script>
</body>
</html>
