<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<title>YouTube Maps</title>

<style>
  :root { --fg:#1a1a1a; --muted:#666; --card:#fff; --bg:#f4f5f7; --accent:#ff0000; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background: var(--bg); color: var(--fg); min-height: 100vh;
  }
  header { padding: 48px 24px 24px; text-align: center; }
  header h1 { margin: 0 0 6px; font-size: 30px; }
  header p { margin: 0; color: var(--muted); }
  main {
    max-width: 900px; margin: 0 auto; padding: 16px 24px 40px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px;
  }
  .card {
    display: flex; flex-direction: column; background: var(--card); border-radius: 12px;
    overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    transition: transform .12s ease, box-shadow .12s ease; border-top: 4px solid var(--accent);
  }
  .card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.14); }
  .card-link { text-decoration: none; color: inherit; display: block; }
  /* Static map preview image at the top of each card. */
  .card-map {
    display: block; width: 100%; height: 150px; object-fit: cover;
    background: #e8eaed;
  }
  .card-body { padding: 16px 18px 12px; }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0; color: var(--muted); font-size: 14px; }
  /* Extra per-channel links (coverage, uploads, …). */
  .card-links {
    margin-top: auto; padding: 10px 18px 14px; display: flex; flex-wrap: wrap; gap: 6px 14px;
    border-top: 1px solid #eee; font-size: 13px;
  }
  .card-links a { color: #1976d2; text-decoration: none; }
  .card-links a:hover { text-decoration: underline; }
  .empty { grid-column: 1/-1; color: var(--muted); text-align: center; padding: 40px; }
  footer { text-align:center; color: var(--muted); font-size: 12px; padding-bottom: 30px; }
  .leaflet-container { background: #dfe3e8; }
</style>
</head>
<body>
  <header>
    <h1>YouTube Maps</h1>
    <p>Maps built from YouTube videos — click a thumbnail to watch the video.</p>
  </header>
  <main id="grid"></main>
  <footer>Map tiles &copy; OpenStreetMap contributors</footer>

<script>
/* =========================================================================
   ADD A CHANNEL HERE
   Each entry: { file, name, note, links }
     file  : the channel's .html file in this folder (the main map)
     name  : title shown on the card
     note  : short description under the title
     links : optional extra pages for this channel, e.g.
             [ { href: "timeteam-coverage.html", label: "Coverage" } ]
   The card thumbnail is a pre-rendered image named after the page
   (e.g. japanese-food-noodles.png). Generate/refresh these with:
       python make_previews.py
   ========================================================================= */
const CHANNELS = [
  {
    file: "timeteam-classics.html",
    name: "Time Team Classics",
    note: "UK Archaeology Digs",
    links: [
      { href: "timeteam-coverage.html", label: "Coverage" },
      { href: "timeteam-uploads.html", label: "Uploads" },
    ],
  },
  {
    file: "japanese-food-noodles.html",
    name: "Japanese Food Noodles",
    note: "Ramen & noodle shops across Japan",
  },
];
/* ===================== end of editable section ===================== */

const grid = document.getElementById("grid");
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

if (!CHANNELS.length) {
  grid.innerHTML = '<div class="empty">No channels yet. Add one to the CHANNELS list.</div>';
} else {
  grid.innerHTML = CHANNELS.map((c) => {
    const img = c.file.replace(/\.html$/, ".png");
    const links = (c.links || [])
      .map((l) => `<a href="${esc(l.href)}">${esc(l.label)}</a>`)
      .join("");
    const linksRow = links ? `<div class="card-links">${links}</div>` : "";
    // If the preview image doesn't exist yet, hide it so the card still looks tidy.
    return `
    <div class="card">
      <a class="card-link" href="${esc(c.file)}">
        <img class="card-map" src="${esc(img)}" alt="" loading="lazy"
             onerror="this.style.display='none'" />
        <div class="card-body">
          <h2>${esc(c.name)}</h2>
          <p>${esc(c.note || "")}</p>
        </div>
      </a>
      ${linksRow}
    </div>`;
  }).join("");
}
</script>
</body>
</html>
